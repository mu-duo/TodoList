[package]
name = "todolist"
version = "1.6.0"
description = "TodoList - 文件驱动的本地待办"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todolist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
ulid = "3"
dirs = "7"
chrono = "0.4"
serde_json = "1.0.154"
base64 = "0.23.1"
zeroize = "1.9.1"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
reqwest = { version = "0.13.5", features = ["json"] }
tauri-plugin-opener = "2.7.1"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[features]
# 测试用假 provider / 密钥存储；release 不含。仅替换网络，不绕过任何安全规则。
agent-test-provider = []

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
