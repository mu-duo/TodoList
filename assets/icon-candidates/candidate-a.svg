<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img">
  <title>TodoList 候选 A · 对勾（实心靛蓝圆角方块 + 白色对勾）</title>
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6ce8"/>
      <stop offset="1" stop-color="#434ec4"/>
    </linearGradient>
  </defs>
  <!-- 满幅圆角方块，留出安全边距交给内部字形 -->
  <rect width="1024" height="1024" rx="224" fill="url(#a-bg)"/>
  <!-- 粗对勾：字形边距约 24%，16px 下仍为清晰折线 -->
  <path d="M312 512 L456 656 L716 368" fill="none" stroke="#ffffff" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
